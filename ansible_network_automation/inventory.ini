# Example Ansible Inventory File for Network Automation

# ------------------------------------------------------------------------------------
# Credentials & Connection Settings (can be defined per group or per host)
# ------------------------------------------------------------------------------------
# It's recommended to use Ansible Vault for sensitive data like passwords.
# For simplicity in this example, they are commented out or placeholders.
#
# [all:vars]
# ansible_user=your_ssh_user
# ansible_password=your_secret_password  # USE VAULT FOR THIS
# ansible_connection=ansible.netcommon.network_cli
# ansible_become=true
# ansible_become_method=enable # For Cisco-like devices needing 'enable' mode
# ansible_become_password=your_enable_password # USE VAULT FOR THIS (if different from login)

# ------------------------------------------------------------------------------------
# Cisco IOS Devices
# ------------------------------------------------------------------------------------
[cisco_routers]
# router1.example.com ansible_host=192.168.1.10
# router2.example.com ansible_host=192.168.1.11

[cisco_switches]
# switch1.example.com ansible_host=192.168.1.12
# switch2.example.com ansible_host=192.168.1.13

[cisco_devices:children]
cisco_routers
cisco_switches

[cisco_devices:vars]
ansible_network_os=cisco.ios.ios
ansible_user=cisco_user # Replace with your username for Cisco devices
ansible_password=cisco_password # Replace with your password - USE VAULT!
ansible_become=true
ansible_become_method=enable
# ansible_become_password=your_enable_password # If enable password is set and different

# ------------------------------------------------------------------------------------
# Juniper Junos Devices
# ------------------------------------------------------------------------------------
[juniper_switches]
# junos_switch1.example.com ansible_host=192.168.2.20
# junos_fw1.example.com ansible_host=192.168.2.21 # Can also be firewalls

[juniper_devices:children]
juniper_switches

[juniper_devices:vars]
ansible_network_os=junipernetworks.junos.junos
ansible_user=juniper_user # Replace with your username for Juniper devices
ansible_password=juniper_password # Replace with your password - USE VAULT!
# Junos doesn't typically use 'enable' mode in the same way as Cisco.
# Connection is usually direct to an operational or configuration mode.
# If you need to execute commands requiring root, you might need different user/become settings.

# ------------------------------------------------------------------------------------
# Example Host with Specific Variables (Overrides group vars)
# ------------------------------------------------------------------------------------
# specific_router.example.com ansible_host=10.0.0.1 ansible_network_os=cisco.ios.ios ansible_user=admin_user

# ------------------------------------------------------------------------------------
# Host Variable Files (host_vars and group_vars)
# ------------------------------------------------------------------------------------
# For more complex setups, it's better to define variables in `host_vars` and `group_vars` directories
# adjacent to your inventory file or playbook.
#
# Example structure:
# ansible_network_automation/
# |-- inventory.ini
# |-- playbook.yml
# |-- host_vars/
# |   |-- router1.example.com.yml
# |   |-- junos_switch1.example.com.yml
# |-- group_vars/
# |   |-- cisco_devices.yml
# |   |-- juniper_devices.yml
#
# Content of group_vars/cisco_devices.yml:
# ---
# ansible_network_os: cisco.ios.ios
# ansible_user: cisco_user
# ansible_password: "{{ vault_cisco_password }}" # Example using vault variable
# ansible_become: true
# ansible_become_method: enable
#
# Content of host_vars/router1.example.com.yml:
# ---
# # Specific variables for router1.example.com
# # These variables will define the interface configurations for the template
# interfaces:
#   - name: GigabitEthernet0/0
#     description: "Uplink to Core"
#     ip_address: 10.10.10.1
#     subnet_mask: 255.255.255.252
#     state: "no shutdown" # or "shutdown"
#   - name: GigabitEthernet0/1
#     description: "LAN Segment A"
#     ip_address: 192.168.100.1
#     subnet_mask: 255.255.255.0
#     state: "no shutdown"
#   - name: Loopback0
#     description: "Router ID"
#     ip_address: 1.1.1.1
#     subnet_mask: 255.255.255.255
#     state: "no shutdown"

# Content of host_vars/junos_switch1.example.com.yml:
# ---
# interfaces:
#   - name: ge-0/0/0
#     description: "Uplink to Core"
#     ip_address: 10.10.20.1
#     subnet_mask: "30" # Use prefix length for Junos in template if preferred
#     state: "no shutdown"
#   - name: ge-0/0/1
#     description: "Access Port VLAN 10"
#     # For access ports, you'd typically configure family ethernet-switching
#     # This interface template is basic; for complex configs, expand the template or use specific Junos modules
#     state: "no shutdown"

# To use this inventory:
# ansible-playbook -i inventory.ini playbook.yml
#
# REMEMBER TO UNCOMMENT AND FILL IN ACTUAL HOSTNAMES/IPS AND CREDENTIALS.
# FOR PRODUCTION, ALWAYS USE ANSIBLE VAULT FOR SENSITIVE INFORMATION.
# Example: ansible-vault encrypt_string 'your_secret_password' --name 'vault_juniper_password'
# Then in vars file: juniper_password: "{{ vault_juniper_password }}"
